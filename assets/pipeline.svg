<text x="425" y="574" text-anchor="middle" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#a1a1aa">clean · blocked · fixed · unverified</text>
<rect x="40" y="612" width="370" height="60" rx="6" fill="#18181b" stroke="#bf8700" stroke-width="1.2"/>
<rect x="40" y="613" width="3" height="58" rx="1.5" fill="#bf8700"/>
<text x="52" y="631" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#bf8700">✎ WRITE GATE</text>
<text x="52" y="646" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#71717a">edit / write blocked while mode ON and no run verified</text>
<text x="52" y="659" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#71717a">released after a pipeline run completes</text>
<rect x="440" y="612" width="370" height="60" rx="6" fill="#18181b" stroke="#0969da" stroke-width="1.2"/>
<rect x="440" y="613" width="3" height="58" rx="1.5" fill="#0969da"/>
<text x="452" y="631" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="10" fill="#0969da">pi-subagents PROBE</text>
<text x="452" y="646" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#71717a">no bridge ⇒ mode cannot be armed</text>
<text x="452" y="659" font-family="SFMono-Regular,ui-monospace,Menlo,Consolas,monospace" font-size="9.5" fill="#71717a">gate fails open, never wedges the session</text>
